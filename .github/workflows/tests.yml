name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

# One run per commit: publishing a release pushes both the branch and the tag,
# which used to start two identical runs and email every failure twice. The
# cancelled duplicate is grey, not red.
concurrency:
  group: tests-${{ github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # 2026-10-25: GitHub's ubuntu-24.04 runner stopped provisioning
            # Python 3.8 — the old-interpreter slot died inside setup-python
            # itself six days after it had run green on the same matrix
            # (v2.9.1). 3.9 is still provisioned there.
            python-version: '3.9'
          - os: ubuntu-latest
            python-version: '3.12'
          # memprobe / terminate / _needs_shell / taskkill are platform
          # branches, so they need real Windows and macOS runners too.
          - os: windows-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.12'
    steps:
      # checkout@v4 / setup-python@v5 target Node.js 20, which GitHub now forces
      # onto Node 24 and reports as a deprecation warning on every run.
      # The first majors that target Node 24 are v5 and v6.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Python 3.3 host compatibility guard
        run: python tests/check_py33.py

      # The regression suite only checks that every file messages.json names
      # exists, so it cannot see a released version that has no message file
      # at all (that is how v1.4.7 and v2.1.1 shipped). This compares the
      # release notes headings with the messages.json keys in both directions.
      # It has to live in tests/: .workbuddy/ is export-ignored and never
      # uploaded, so nothing under it can be run here.
      - name: Release notes and messages.json agree
        run: python tests/check_messages.py

      - name: Regression tests (no Sublime required)
        shell: bash
        # The suite prints one line per check, so a red job said nothing more
        # than "exit code 1" unless someone opened the log - and the log needs
        # repo admin rights to fetch, which is exactly when a platform-only
        # failure (it passed on Linux and macOS, failed only on Windows) is
        # worth reading. Echo the failing check labels as annotations: they show
        # up on the check run itself and via the public annotations API.
        run: |
          set +e
          python tests/run_tests.py 2>&1 | tee run_tests.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error::run_tests.py failed on $RUNNER_OS (exit $code)"
            grep -E '^  - ' run_tests.log | head -40 | while IFS= read -r line; do
              echo "::error::failed check: ${line#  - }"
            done
          fi
          exit "$code"

      # A directory handed to the import dialog produced
      # `[Errno 13] Permission denied` on Windows, which reads like a real
      # permissions problem and sends the user looking in the wrong place.
      - name: Import guards reject directories, not files
        run: python tests/check_import_dir.py

      # Numbers for the "is a C++ rewrite worth it" answer. Not a gate: it
      # prints what the Python parts cost compared with a g++ compile.
      - name: Cost of the Python layer (informational)
        if: always()
        run: python tests/check_perf.py

      - name: Byte-compile every module
        run: python -m compileall -q .
